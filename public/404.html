<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Toque de Guerra – Redirecionando...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegments = window.location.pathname.split('/');
      var repoSegment = pathSegments[1] === 'toque-de-guerra' ? '/toque-de-guerra/' : '/';
      window.location.replace(window.location.origin + repoSegment);
    </script>
  </head>
  <body style="background-color: #121417; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecionando para o jogo...</p>
  </body>
</html>
